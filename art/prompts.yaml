# Plank Run — prompt library (machine-readable). Generated together with docs/plan/spec-visual-art.md §6.
# Edit prompts here and in the spec together; IDs are stable.
version: 1
updated: '2026-10-19'
spec: docs/plan/spec-visual-art.md
how_to_use: 'Owner: copy prompt_gemini into the Gemini app (Nano Banana Pro) or prompt_chatgpt into ChatGPT, attach the canon refs listed in refs, generate `variants` images, download originals and send them (see art/README.md). For background: pair, send the follow-up turn in the same chat and download both images. Assistant: fills results[] with file, sha256, tool, model_label, date, chat and selected.'
schema:
  id: Pxx / Vxx, stable, never reused
  asset: asset ID from the master inventory (spec §5)
  tools: gemini | chatgpt; first = primary
  aspect: requested aspect; chatgpt_size = what to pick in ChatGPT before cropping
  background: scene | black (glow, luminance alpha) | white (concept only) | pair (white then black, difference matting)
  refs: canon refs C1..C6 (art/canon) or an approved prompt result marked Pxx*
  variants: how many images to generate per tool
  post: processing steps of scripts/art (spec §7.3)
  results: '[{file, sha256, tool, model_label, date, chat, selected, notes}] — filled by the assistant'
canon_refs:
  C1:
    file: art/canon/c1-palette-board.png
    made_by: assistant (from tokens)
    sha256: null
  C2:
    file: art/canon/c2-meadow.png
    made_by: owner via P01, approved
    sha256: null
  C3:
    file: art/canon/c3-tunnel.png
    made_by: owner via P02, approved
    sha256: null
  C4:
    file: art/canon/c4-iskra-sheet.png
    made_by: assistant (SVG render)
    sha256: null
  C5:
    file: art/canon/c5-objects.png
    made_by: owner via P03, approved
    sha256: null
  C6:
    file: art/canon/c6-illustration.png
    made_by: owner via P04, approved
    sha256: null
blocks:
  STYLE_CORE: 'Stylized 2D game art for a calm night-time fitness game. Flat, vector-like shapes with soft smooth gradients, no outlines, rounded friendly forms, large clear silhouettes and very little fine detail. Palette: deep navy and indigo night tones (#0B0D17, #12152A, #161A33, #1E2347, #2E3566) with glowing accents only in mint #5EF2C2, violet #7C6CFF, soft lavender #A397FF, warm gold #FFD25E, sky cyan #4CC9FF and firefly lime #D8FF6A. Lighting: cool moonlight from the upper left with a thin lavender rim light on silhouette edges; warm light comes only from glowing objects. Every glow is a bright core with two soft round halos. Mood: cozy, quiet, hopeful, playful, readable from two meters away on a small screen.'
  AVOID: 'Avoid: any text, letters, numbers or symbols; logos and brand marks; watermarks and signatures; UI elements, frames, borders or card shapes; checkerboard transparency patterns; photorealism; glossy 3D plastic render; lens flares and four-pointed sparkle stars; heavy noise, film grain or paper texture; harsh black outlines; people, human faces and human hands.'
  BG_BLACK: 'Background: perfectly flat solid pure black (#000000) filling the whole canvas edge to edge; no gradient, vignette, floor, cast shadow or reflection.'
  BG_WHITE: 'Background: perfectly flat solid pure white (#FFFFFF) filling the whole canvas edge to edge; no gradient, vignette, floor, cast shadow or reflection.'
  FOLLOWUP_BLACK: 'Repeat exactly the same image: identical composition, size, position and colors of every element. Change only the background to perfectly flat solid pure black (#000000). Do not redraw, move, crop or restyle anything.'
  CHATGPT_TRANSPARENT: Output a PNG with a real transparent background (alpha channel), not a drawn checkerboard. If real transparency is not possible, use a perfectly flat solid pure magenta (#FF00FF) background instead.
  SHEET: Lay the items out on an even grid with wide empty gaps; items must not touch or overlap; same scale, front view.
  CALM_CENTER: 'Composition: keep the central area calm, dark and low-contrast because game objects will be drawn on top; put visual interest near the top edge and the horizon.'
  TILE_H: The left and right edges must continue seamlessly so the image can repeat horizontally.
  TILE_V: The top and bottom edges must continue seamlessly so the image can repeat vertically.
  GEMINI_PREFIX: Generate an image.
  GEMINI_REFS: Use the attached reference images only for style, palette and lighting; do not copy their content or layout.
  GEMINI_CHAR_REFS: 'Use the attached mascot drawing as the exact character design: keep its perfectly round body, tall oval eyes and three-lobed flame tuft unchanged.'
  GEMINI_QUALITY: High resolution, crisp clean edges.
  CHATGPT_PREFIX: Create one image.
  CHATGPT_REFS: Match the style, palette, lighting and flatness of the attached reference images; do not copy their content.
  CHATGPT_CHAR_REFS: 'The attached drawing is the exact mascot design: keep its perfectly round body, tall oval eyes and three-lobed flame tuft; do not add arms or legs (small floating sparks act as hands).'
  CHATGPT_COLOR: Keep a cool color temperature with true deep navy blacks; no warm yellow or sepia cast.
  CHATGPT_LITERAL: Do not add any elements that are not described.
